name: pw-educamos-notifier
services:
  pw-educamos-notifier:
    container_name: pw-educamos-notifier
    #build: .
    image: pw-educamos-notifier:latest
    env_file:
      - .env
    # Run tini as PID 1 to reap zombie headless_shell processes left by Chromium
    init: true
    restart: on-failure